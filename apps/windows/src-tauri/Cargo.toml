[package]
name = "nexthrum"
version = "2.0.0"
description = "Nexthrum Windows Client"
authors = ["You"]
edition = "2021"

[lib]
name = "nexthrum_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexthrum-core = { path = "../../../crates/nexthrum-core" }
nexthrum-gotify = { path = "../../../crates/nexthrum-gotify" }
nexthrum-storage = { path = "../../../crates/nexthrum-storage" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
