name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: |
            ## Nexthrum 2.0.0

            首个跨平台版本：Windows 与 macOS 共用一套 Rust 内核。
            First cross-platform release: one shared Rust core behind both native clients.

            ### 下载 / Downloads

            | 平台 / Platform | 文件 / File | 说明 / Notes |
            |---|---|---|
            | Windows | `Nexthrum_2.0.0_x64-setup.exe` | NSIS 安装包，按当前用户安装 / per-user installer |
            | Windows | `Nexthrum_2.0.0_x64-portable.zip` | 便携版，解压即用 / portable, extract and run |
            | macOS (arm64) | `Nexthrum-2.0.0-arm64.dmg` | 拖入 Applications 即可 / drag to Applications |
            | 自动更新 / Updates | `latest.json` · `appcast.xml` | 由应用自动使用 / consumed by the apps |

            ### 系统要求 / Requirements
            - Windows 10 1809+ / Windows 11（WebView2，Win11 已内置 / built into Win11）
            - macOS 14+，Apple Silicon（arm64）

            ### 安装说明 / Installation
            - **Windows**：安装包未做 Authenticode 签名，首次运行会提示 SmartScreen，选择「更多信息 → 仍要运行」。
              Unsigned installer: choose "More info → Run anyway" on first launch.
            - **macOS**：未做公证，首次打开需右键 → 打开，或执行
              `xattr -dr com.apple.quarantine /Applications/Nexthrum.app`。
              由 Sparkle 安装的更新不带隔离标记，后续升级不会再提示。
              Not notarized: right-click → Open the first time; Sparkle updates are not quarantined.
            - 从 2.0 早期构建升级：请先删除旧的 `NexthrumMac.app`（bundle id 与数据不变）。

            ### 快速开始 / Quick Start
            1. 启动 Nexthrum：窗口打开，托盘 / 菜单栏出现图标。
            2. 在设置中填入 Gotify 服务器地址与客户端令牌（Gotify 网页端 → Clients）。
            3. 点击「测试连接」，然后保存；消息会实时出现在列表并触发系统通知。
            4. 首次运行有引导页，可跳过并稍后配置。
              First launch shows a short onboarding guide; it can be skipped.

            ### 本版要点 / Highlights
            - 共享 Rust 内核（Core 用例、Gotify 客户端、SQLite、UniFFI 桥接）
            - 卡片式消息列表、搜索、来源筛选、托盘未读红点、菜单栏面板
            - 凭据存于 Windows 凭据管理器 / macOS 钥匙串，不写入设置 JSON
            - 自动更新：Windows 走 `latest.json`，macOS 走 Sparkle `appcast.xml`
            - 中英双语界面（Windows 可切换，macOS 跟随系统）
            - 许可：AGPL-3.0

            ### 已知限制 / Known limitations
            - Windows 无 Authenticode 签名；macOS 无 Developer ID 与公证（首次安装提示无法避免）。
            - macOS 通知、登录项与退出清理仍需实机验收记录。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Create portable zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The Cargo workspace publishes artifacts to the repository root target/.
          VERSION=$(node -p "require('./apps/windows/package.json').version")
          PORTABLE="Nexthrum_${VERSION}_x64-portable.zip"
          exe="target/${{ matrix.target }}/release/nexthrum.exe"
          if [ -f "$exe" ]; then
            cp "$exe" Nexthrum.exe
            7z a "$PORTABLE" Nexthrum.exe
            echo "PORTABLE_NAME=$PORTABLE" >> "$GITHUB_ENV"
            echo "Portable zip created: $PORTABLE"
          else
            echo "ERROR: Release exe not found at $exe"
            ls -la "target/${{ matrix.target }}/release/" 2>/dev/null || true
            exit 1
          fi

      - name: Upload portable to Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "$PORTABLE_NAME" --clobber

          # The updater reads the signature from latest.json, so the standalone
          # .sig asset is redundant noise in the release.
          gh release view "${{ github.ref_name }}" --json assets \
            --jq '.assets[].name | select(endswith(".sig"))' |
            while read -r sig; do
              [ -n "$sig" ] && gh release delete-asset "${{ github.ref_name }}" "$sig" --yes
            done

  macos:
    name: macOS arm64 release
    runs-on: macos-14
    # Wait for the Windows job, which creates the release through tauri-action.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Fetch Sparkle tools
        run: |
          curl -sSL -o sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          tar -xf sparkle.tar.xz ./bin
          echo "SPARKLE_BIN=$PWD/bin" >> "$GITHUB_ENV"

      - name: Import self-signed signing identity
        timeout-minutes: 5
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-signing
        run: |
          # No Apple Developer certificate is available. A *stable* self-signed
          # identity keeps the signature (Sparkle identity checks, Keychain ACLs)
          # consistent between releases. Gatekeeper still warns on first install.
          KEYCHAIN="$RUNNER_TEMP/nexthrum-signing.keychain-db"
          P12="$RUNNER_TEMP/identity.p12"

          echo "$MACOS_SIGNING_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # codesign only lists trusted identities. Trust must go to the admin
          # domain: the user domain triggers an Authorization Services prompt
          # that cannot be answered on a runner (the job hangs there).
          # macOS ships LibreSSL, whose pkcs12 has no -legacy flag.
          openssl pkcs12 -in "$P12" -nokeys \
            -passin pass:"$MACOS_SIGNING_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          security find-identity -v -p codesigning | grep -F "Nexthrum Local Signing"

      - name: Build signed app bundle
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          CODE_SIGN_IDENTITY="Nexthrum Local Signing" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGNING_ALLOWED=YES \
          DERIVED_DATA_PATH="$PWD/target/xcode-derived" \
            scripts/build-macos-xcode.sh

      - name: Package update archive
        run: |
          VERSION=$(node -p "require('./apps/windows/package.json').version")
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            target/xcode-derived/Build/Products/Debug/Nexthrum.app \
            "dist/Nexthrum-${VERSION}.zip"

      - name: Sign appcast
        timeout-minutes: 10
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          # Pass the key as a file: importing it into the keychain triggers an
          # Authorization prompt that hangs on a runner.
          echo "$SPARKLE_EDDSA_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          "$SPARKLE_BIN/generate_appcast" dist \
            --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"

      - name: Verify appcast signature
        timeout-minutes: 5
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          URL=$(python3 -c "import re,sys;print(re.search(r'url=\"([^\"]+)\"', open('dist/appcast.xml').read()).group(1))")
          SIGNATURE=$(python3 -c "import re;print(re.search(r'edSignature=\"([^\"]+)\"', open('dist/appcast.xml').read()).group(1))")
          echo "enclosure: $URL"
          echo "signature: $SIGNATURE"
          test -n "$URL" && test -n "$SIGNATURE"

      - name: Upload macOS update to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # The Windows job creates the release; wait for it instead of racing.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release upload "$TAG" dist/appcast.xml dist/*.zip --clobber
