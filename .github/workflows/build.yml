name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: |
            ## 安装说明 / Installation

            ### Windows

            | 文件 / File | 说明 / Description |
            |------|------|
            | `Nexthrum_*_x64-setup.exe` | NSIS 安装包 / NSIS installer |
            | `Nexthrum_portable.zip` | 便携版，解压即用 / Portable, extract and run |

            ### 系统要求 / Requirements
            - Windows 10 1809+ / Windows 11
            - WebView2 (pre-installed on Win11)

            ### 使用步骤 / Quick Start
            1. 安装或解压后运行 / Install or extract and run
            2. 设置中填入 Gotify 服务器地址和令牌 / Enter Gotify server URL & token in Settings
            3. 点击「测试连接」/ Click "Test Connection"
            4. 保存设置，开始接收消息 / Save settings, start receiving
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Create portable zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The Cargo workspace publishes artifacts to the repository root target/.
          exe="target/${{ matrix.target }}/release/nexthrum.exe"
          if [ -f "$exe" ]; then
            cp "$exe" Nexthrum.exe
            7z a "Nexthrum_portable.zip" Nexthrum.exe
            echo "Portable zip created successfully"
          else
            echo "ERROR: Release exe not found at $exe"
            ls -la "target/${{ matrix.target }}/release/" 2>/dev/null || true
            exit 1
          fi

      - name: Upload portable to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Nexthrum_portable.zip

  macos:
    name: macOS arm64 release
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Fetch Sparkle tools
        run: |
          curl -sSL -o sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          tar -xf sparkle.tar.xz ./bin
          echo "SPARKLE_BIN=$PWD/bin" >> "$GITHUB_ENV"

      - name: Import self-signed signing identity
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-signing
        run: |
          # No Apple Developer certificate is available. A *stable* self-signed
          # identity keeps the signature (Sparkle identity checks, Keychain ACLs)
          # consistent between releases. Gatekeeper still warns on first install.
          KEYCHAIN="$RUNNER_TEMP/nexthrum-signing.keychain-db"
          P12="$RUNNER_TEMP/identity.p12"

          echo "$MACOS_SIGNING_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # codesign only lists identities that are trusted for code signing.
          openssl pkcs12 -in "$P12" -legacy -nokeys \
            -passin pass:"$MACOS_SIGNING_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem"

          security find-identity -v -p codesigning | grep -F "Nexthrum Local Signing"

      - name: Build signed app bundle
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          CODE_SIGN_IDENTITY="Nexthrum Local Signing" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGNING_ALLOWED=YES \
          DERIVED_DATA_PATH="$PWD/target/xcode-derived" \
            scripts/build-macos-xcode.sh

      - name: Package update archive
        run: |
          VERSION=$(node -p "require('./apps/windows/package.json').version")
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            target/xcode-derived/Build/Products/Debug/Nexthrum.app \
            "dist/Nexthrum-${VERSION}.zip"

      - name: Sign appcast
        run: |
          # Import the EdDSA key into the temporary keychain so generate_appcast
          # can sign the enclosure.
          echo "$SPARKLE_EDDSA_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          "$SPARKLE_BIN/generate_keys" -f "$RUNNER_TEMP/sparkle.key"
          "$SPARKLE_BIN/generate_appcast" dist \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}

      - name: Upload macOS update to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/appcast.xml
            dist/*.zip
