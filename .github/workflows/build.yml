name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: |
            ## 简介

            Nexthrum 是连接 Gotify 服务器的桌面消息客户端：Windows 使用 Tauri + React，macOS 使用 SwiftUI，两端共用一套 Rust 内核（消息、存储、连接规则只实现一次）。消息实时到达，支持按来源筛选与搜索，未读数以本地 SQLite 快照为准。

            ## 下载文件

            | 文件 | 用途 |
            |---|---|
            | `Nexthrum_<version>_x64-setup.exe` | Windows 安装包，按当前用户安装，无需管理员权限 |
            | `Nexthrum_<version>_x64-portable.zip` | Windows 便携版，解压后双击 `Nexthrum.exe` 直接运行 |
            | `Nexthrum-<version>-arm64.dmg` | macOS（Apple Silicon）安装镜像，打开后拖入「应用程序」 |
            | `Nexthrum-<version>.zip` | macOS 应用包压缩版，供 Sparkle 自动更新使用 |
            | `latest.json`、`appcast.xml` | 更新清单，由应用自动读取，无需手动下载 |

            > Windows 安装包未做 Authenticode 签名，首次运行若出现 SmartScreen 提示，选择「更多信息 → 仍要运行」。
            > macOS 未做公证，首次打开请右键 → 打开（或执行 `xattr -dr com.apple.quarantine /Applications/Nexthrum.app`）。

            ## 系统要求

            - Windows 10 1809+ 或 Windows 11（依赖 WebView2，Win11 与新版 Win10 已内置）
            - macOS 14.0 Sonoma 及以上，Apple Silicon（arm64）
            - 可访问的 Gotify 服务器，以及其在 Gotify 网页端「Clients」中创建的客户端令牌

            ## 本版亮点

            - Windows 界面全面重做：竖版窗口（默认 400×680）、类 macOS 扁平视觉、标题栏含 Logo 与最小化/最大化/关闭
            - 消息列表改为细分割线的扁平行，标题、正文、来源徽标三档层级清晰，未读用圆点 + 字重 + 强调色时间表达
            - 主题独立为切换按钮（深色 / 白天），设置入口改为独立文字按钮，不再与主题混淆
            - 设置页按 macOS 设置风格分组：服务器连接、启动与窗口、外观、免打扰
            - 修复 Windows 全站样式失效（未分层 CSS 覆盖 Tailwind 工具类）、空白窗口（开发端口被 Hyper-V 保留）等问题
            - Tauri 插件版本成对锁定，新增 `check:tauri-versions` 校验并接入 CI
            - macOS：可在设置中隐藏程序坞图标（仅保留菜单栏入口）、切换界面语言

          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Create portable zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The Cargo workspace publishes artifacts to the repository root target/.
          VERSION=$(node -p "require('./apps/windows/package.json').version")
          PORTABLE="Nexthrum_${VERSION}_x64-portable.zip"
          exe="target/${{ matrix.target }}/release/nexthrum.exe"
          if [ -f "$exe" ]; then
            cp "$exe" Nexthrum.exe
            7z a "$PORTABLE" Nexthrum.exe
            echo "PORTABLE_NAME=$PORTABLE" >> "$GITHUB_ENV"
            echo "Portable zip created: $PORTABLE"
          else
            echo "ERROR: Release exe not found at $exe"
            ls -la "target/${{ matrix.target }}/release/" 2>/dev/null || true
            exit 1
          fi

      - name: Upload portable to Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "$PORTABLE_NAME" --clobber

          # The updater reads the signature from latest.json, so the standalone
          # .sig asset is redundant noise in the release.
          gh release view "${{ github.ref_name }}" --json assets \
            --jq '.assets[].name | select(endswith(".sig"))' |
            while read -r sig; do
              [ -n "$sig" ] && gh release delete-asset "${{ github.ref_name }}" "$sig" --yes
            done

  macos:
    name: macOS arm64 release
    runs-on: macos-14
    # Wait for the Windows job, which creates the release through tauri-action.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Fetch Sparkle tools
        run: |
          curl -sSL -o sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          tar -xf sparkle.tar.xz ./bin
          echo "SPARKLE_BIN=$PWD/bin" >> "$GITHUB_ENV"

      - name: Import self-signed signing identity
        timeout-minutes: 5
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-signing
        run: |
          # No Apple Developer certificate is available. A *stable* self-signed
          # identity keeps the signature (Sparkle identity checks, Keychain ACLs)
          # consistent between releases. Gatekeeper still warns on first install.
          KEYCHAIN="$RUNNER_TEMP/nexthrum-signing.keychain-db"
          P12="$RUNNER_TEMP/identity.p12"

          echo "$MACOS_SIGNING_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # codesign only lists trusted identities. Trust must go to the admin
          # domain: the user domain triggers an Authorization Services prompt
          # that cannot be answered on a runner (the job hangs there).
          # macOS ships LibreSSL, whose pkcs12 has no -legacy flag.
          openssl pkcs12 -in "$P12" -nokeys \
            -passin pass:"$MACOS_SIGNING_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          security find-identity -v -p codesigning | grep -F "Nexthrum Local Signing"

      - name: Build signed app bundle
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          CODE_SIGN_IDENTITY="Nexthrum Local Signing" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGNING_ALLOWED=YES \
          DERIVED_DATA_PATH="$PWD/target/xcode-derived" \
            scripts/build-macos-xcode.sh

      - name: Package update archive and DMG
        run: |
          VERSION=$(node -p "require('./apps/windows/package.json').version")
          APP="target/xcode-derived/Build/Products/Debug/Nexthrum.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Nexthrum-${VERSION}.zip"

          # Human download: same archive layout as scripts/package-macos-dmg.sh.
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Nexthrum" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/Nexthrum-${VERSION}-arm64.dmg" >/dev/null

      - name: Sign appcast
        timeout-minutes: 10
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          # Pass the key as a file: importing it into the keychain triggers an
          # Authorization prompt that hangs on a runner.
          echo "$SPARKLE_EDDSA_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          "$SPARKLE_BIN/generate_appcast" dist \
            --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"

      - name: Verify appcast signature
        timeout-minutes: 5
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          URL=$(python3 -c "import re,sys;print(re.search(r'url=\"([^\"]+)\"', open('dist/appcast.xml').read()).group(1))")
          SIGNATURE=$(python3 -c "import re;print(re.search(r'edSignature=\"([^\"]+)\"', open('dist/appcast.xml').read()).group(1))")
          echo "enclosure: $URL"
          echo "signature: $SIGNATURE"
          test -n "$URL" && test -n "$SIGNATURE"

      - name: Upload macOS update to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # The Windows job creates the release; wait for it instead of racing.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release upload "$TAG" dist/appcast.xml dist/*.zip dist/*.dmg --clobber
